# Render blueprint — deploys backend/ as a web service.
# Setup: Render → New → Blueprint → this repo. After the Vercel frontend is
# deployed, replace the CORS_ORIGINS value below with its URL.
services:
  - type: web
    name: neuroscan-api
    runtime: python
    rootDir: backend
    # Default: free tier (512 MB, cold starts after idle).
    #  -> `0.5c-512mb` (~$7/mo) keeps it always-on so the demo never cold-starts.
    #  -> `1c-2g` (2 GB RAM) if the service OOMs while loading TensorFlow.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.11.9
